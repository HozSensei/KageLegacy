# Production NAS — MySQL externe (comme pbbg).
# Copier vers .env.prod et renseigner les secrets.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  kage-app:
    image: ghcr.io/hozsensei/kage-legacy:main
    container_name: kage_app
    restart: always
    ports:
      - "${KAGE_HOST_PORT:-3002}:80"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-kage_legacy}
      CORS_ORIGIN: ${CORS_ORIGIN}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-${CORS_ORIGIN}}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_ELITE_PRICE_ID: ${STRIPE_ELITE_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      AUTH_DEMO_FALLBACK: ${AUTH_DEMO_FALLBACK:-false}
      CYCLE_START_AT: ${CYCLE_START_AT:-}
      CYCLE_START_AT_APPLY: ${CYCLE_START_AT_APPLY:-false}
