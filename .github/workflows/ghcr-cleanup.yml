name: GHCR cleanup

# Purge les versions du package container kage-legacy.
# Actions → GHCR cleanup → Run workflow (confirm = delete-all).
#
# Prérequis : sur le package GHCR kage-legacy → Package settings →
# Manage Actions access → donner le rôle Admin au dépôt KageLegacy.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Taper delete-all pour confirmer la suppression'
        required: true
        type: string
      min_versions_to_keep:
        description: 'Nombre de versions les plus récentes à conserver (0 = tout supprimer)'
        required: false
        type: string
        default: '0'

permissions:
  contents: read
  packages: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        if: ${{ inputs.confirm != 'delete-all' }}
        run: |
          echo "Confirmation invalide. Relancer avec confirm=delete-all."
          exit 1

      # max 100 versions / run — plusieurs passes (min-versions-to-keep
      # ne peut PAS être combiné avec num-old-versions-to-delete)
      - name: Delete package versions (pass 1)
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: kage-legacy
          package-type: container
          min-versions-to-keep: ${{ inputs.min_versions_to_keep }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete package versions (pass 2)
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: kage-legacy
          package-type: container
          min-versions-to-keep: ${{ inputs.min_versions_to_keep }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete package versions (pass 3)
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: kage-legacy
          package-type: container
          min-versions-to-keep: ${{ inputs.min_versions_to_keep }}
          token: ${{ secrets.GITHUB_TOKEN }}
