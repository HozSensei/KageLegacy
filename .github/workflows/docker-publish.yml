name: Docker publish

# Publie l'image GHCR uniquement pour une release versionnée (tag semver),
# plus déclenchement manuel si besoin.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag image à publier (ex. v1.2.3). Vide = SHA court + main.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LC}/kage-legacy"
          TAGS=""

          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="$REF_NAME"
          elif [ -n "${DISPATCH_TAG:-}" ]; then
            VERSION="$DISPATCH_TAG"
          else
            VERSION=""
          fi

          if [ -n "$VERSION" ]; then
            case "$VERSION" in
              v*.*.*) ;;
              *)
                echo "Tag invalide: $VERSION (attendu vX.Y.Z)"
                exit 1
                ;;
            esac
            # v1.2.3 + 1.2.3 + main (pointeur prod actuel)
            PLAIN="${VERSION#v}"
            TAGS="${IMAGE}:${VERSION}"
            TAGS="${TAGS}"$'\n'"${IMAGE}:${PLAIN}"
            TAGS="${TAGS}"$'\n'"${IMAGE}:main"
          else
            # Dispatch manuel sans tag : SHA court + main uniquement
            SHORT="$(echo "$SHORT_SHA" | cut -c1-12)"
            TAGS="${IMAGE}:${SHORT}"
            TAGS="${TAGS}"$'\n'"${IMAGE}:main"
          fi

          {
            echo "image=${IMAGE}"
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Tags à pousser:"
          echo "$TAGS"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
