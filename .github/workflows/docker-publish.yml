name: Docker publish

# Publie l'image GHCR uniquement pour une release versionnée (semver).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version à publier (ex. v0.1.0 ou 0.1.0) — obligatoire'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LC}/kage-legacy"

          if [ "$EVENT_NAME" = "push" ]; then
            RAW="$REF_NAME"
          else
            RAW="${DISPATCH_TAG:-}"
          fi

          RAW="$(echo "$RAW" | xargs)"
          if [ -z "$RAW" ]; then
            echo "Tag manquant (attendu vX.Y.Z ou X.Y.Z)"
            exit 1
          fi

          # Accepte v0.1.0 ou 0.1.0
          case "$RAW" in
            v[0-9]*.[0-9]*.[0-9]*)
              VERSION="$RAW"
              ;;
            [0-9]*.[0-9]*.[0-9]*)
              VERSION="v${RAW}"
              ;;
            *)
              echo "Tag invalide: ${RAW} (attendu vX.Y.Z ou X.Y.Z)"
              exit 1
              ;;
          esac

          PLAIN="${VERSION#v}"
          # Footer : « Version 0.1.0 » (sans préfixe v)
          APP_VERSION="$PLAIN"

          TAGS="${IMAGE}:${VERSION}"
          TAGS="${TAGS}"$'\n'"${IMAGE}:${PLAIN}"
          TAGS="${TAGS}"$'\n'"${IMAGE}:main"

          {
            echo "image=${IMAGE}"
            echo "app_version=${APP_VERSION}"
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Tags à pousser:"
          echo "$TAGS"
          echo "VITE_APP_VERSION=${APP_VERSION}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VITE_APP_VERSION=${{ steps.meta.outputs.app_version }}
