name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: ESLint frontend
        run: npm run lint --prefix frontend

      - name: Audit imports backend (cross-exports)
        run: npm run audit:imports --prefix backend

      - name: Smoke test sceau chakra
        run: npm run test:daily-seal --prefix backend

      - name: Smoke test calendrier ligue
        run: npm run test:pool-schedule --prefix backend

      - name: Smoke test butin combat
        run: npm run test:combat-loot --prefix backend

      - name: Smoke test moteur narratif
        run: npm run test:narrative --prefix backend

      - name: Smoke test système entraînement
        run: npm run test:training-system --prefix backend

      - name: Smoke test progression grades
        run: node scripts/testGradeProgression.js
        working-directory: backend

      - name: Calibrage économie (analytique)
        run: npm run economy:calibrate --prefix backend

      - name: Benchmark combat (smoke)
        run: npm run combat:benchmark --prefix backend -- --runs=100

      - name: Smoke test combat par plis
        run: npm run test:pli-combat --prefix backend

      - name: Benchmark combat par plis (smoke)
        run: npm run combat:pli-deck --prefix backend -- --runs=100

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kage_legacy
          MYSQL_USER: kage
          MYSQL_PASSWORD: kage
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ukage -pkage"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: kage
      DB_PASSWORD: kage
      DB_NAME: kage_legacy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Install Cypress binary
        run: npx cypress install

      - name: Prepare database (migrate, seed, cycle H0→H72)
        run: npm run e2e:prepare

      - name: Run Cypress E2E
        run: npm run test:e2e

      - name: Test mission de reconnaissance
        run: npm run test:reconnaissance --prefix backend

      - name: Test scout cycle H36/H54
        run: npm run test:scout-cycle --prefix backend

      - name: Test gels de cycle H54/H71
        run: npm run test:cycle-freezes --prefix backend

      - name: Test dossier d'opération
        run: npm run test:operation-dossier --prefix backend

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
