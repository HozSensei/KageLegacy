name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: ESLint frontend
        run: npm run lint --prefix frontend

      - name: Smoke test moteur narratif
        run: npm run test:narrative --prefix backend

      - name: Smoke test insubordination Égoïste
        run: npm run test:egoiste --prefix backend

      - name: Calibrage économie (analytique)
        run: npm run economy:calibrate --prefix backend

      - name: Benchmark combat (smoke)
        run: npm run combat:benchmark --prefix backend -- --runs=100

      - name: Benchmark cartes tactiques (smoke)
        run: npm run combat:tactic-cards --prefix backend -- --runs=100
