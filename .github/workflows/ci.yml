name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        id: install
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: ESLint backend
        run: npm run lint --prefix backend

      - name: ESLint frontend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint --prefix frontend

      - name: Build frontend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build --prefix frontend

      - name: Audit imports backend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run audit:imports --prefix backend

  tcg-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kage_legacy_e2e
          MYSQL_USER: kage
          MYSQL_PASSWORD: kage
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ukage -pkage"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: kage
      DB_PASSWORD: kage
      DB_NAME: kage_legacy_e2e
      E2E_ALLOW_SEED: 'true'
      ENABLE_SCHEDULER: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        id: install
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Card system
        run: npm run test:card-system --prefix backend

      - name: Economy and shop
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run test:economy --prefix backend
          npm run test:boosters --prefix backend
          npm run test:shop --prefix backend

      - name: Starter loadout
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:starter-loadout --prefix backend

      - name: Scheduler and E2E guard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run test:scheduler --prefix backend
          npm run test:e2e-guard --prefix backend
          node backend/scripts/testE2eBattlePass.js

      - name: Combat engine
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:combat-engine --prefix backend

      - name: Combat balance
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:combat-balance --prefix backend

      - name: Mission runs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:mission-run --prefix backend

      - name: PvP matchmaking
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:pvp-matchmaking --prefix backend

      - name: Prepare TCG database
        id: prepare
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run e2e:prepare

      - name: Player character
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: npm run test:player-character --prefix backend

      - name: Talents
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: npm run test:talent-tree --prefix backend

      - name: Battle Pass
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: npm run test:battle-pass --prefix backend

      - name: Shop Stripe
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: npm run test:shop-stripe --prefix backend

      - name: Install Cypress binary
        id: cypress
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: npx cypress install

      - name: Run Cypress E2E
        id: e2e
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.cypress.outcome == 'success' }}
        run: npm run test:e2e

      - name: Upload Cypress screenshots on failure
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
