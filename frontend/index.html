<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f0e6" />
    <title>Kage Legacy</title>
    <style>
      /* Fond posé avant le chargement de la feuille de style : mêmes valeurs que --color-bg. */
      html {
        background: #f5f0e6;
      }
      html[data-theme='dark'] {
        background: #14182b;
        color-scheme: dark;
      }
      html[data-theme='ink'] {
        background: #1a1614;
        color-scheme: dark;
      }
      html[data-theme='amber'] {
        background: #140c08;
        color-scheme: dark;
      }
    </style>
    <script>
      // Applique le thème avant le premier rendu (même règle que src/composables/useTheme.js).
      // Système sombre → `dark` (indigo), jamais `ink` / `amber` automatiquement.
      ;(function () {
        var theme = null
        var allowed = { light: 1, dark: 1, ink: 1, amber: 1 }
        var colors = { light: '#f5f0e6', dark: '#14182b', ink: '#1a1614', amber: '#140c08' }
        try {
          theme = localStorage.getItem('kage-legacy-theme')
        } catch (e) {}
        if (!allowed[theme]) {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        }
        document.documentElement.setAttribute('data-theme', theme)
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', colors[theme])
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
