services:
  mysql:
    image: mysql:8.0
    container_name: kage-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kage_legacy
      MYSQL_USER: kage
      MYSQL_PASSWORD: kage
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ukage", "-pkage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
